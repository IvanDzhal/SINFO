services:
  frontend:
    build:
      context: ./sinfo
      dockerfile: Dockerfile.dev
    container_name: sinfo_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./sinfo:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=http://localhost:3000/api
    depends_on:
      - db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: sinfo_backend
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./secrets:/run/secrets:ro
    environment:
      - DATABASE_URL=postgresql://sinfo:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/sinfo_db?schema=public
      - GOOGLE_CREDENTIALS_PATH=/run/secrets/google-service-account.json
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:?set in .env}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:?set in .env}
      - LINK_SIGNING_SECRET=${LINK_SIGNING_SECRET:?set in .env}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173}
      - REDIS_URL=redis://redis:6379
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - S3_ENDPOINT=http://seaweedfs:8333
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:?set in .env}
      - S3_SECRET_KEY=${S3_SECRET_KEY:?set in .env}
      - S3_BUCKET=sinfo
    depends_on:
      - db
      - redis

  db:
    image: postgres:17-alpine
    container_name: sinfo_db
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: sinfo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: sinfo_db
    volumes:
      - sinfo_db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d

  redis:
    image: redis:7-alpine
    container_name: sinfo_redis
    ports:
      - "127.0.0.1:6379:6379"

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: sinfo_storage
    restart: unless-stopped
    command: server -dir=/data -s3
    environment:
      - AWS_ACCESS_KEY_ID=${S3_ACCESS_KEY:?set in .env}
      - AWS_SECRET_ACCESS_KEY=${S3_SECRET_KEY:?set in .env}
    volumes:
      - sinfo_storage_data:/data

  adminer:
    image: adminer:latest
    container_name: sinfo_adminer
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      - db

volumes:
  sinfo_db_data:
  sinfo_storage_data: