services:
  frontend:
    build:
      context: ./sinfo
      dockerfile: Dockerfile.dev
    container_name: sinfo_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./sinfo:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=http://localhost:3000/api
    depends_on:
      - db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: sinfo_backend
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - DATABASE_URL=postgresql://sinfo:sinfo_password@db:5432/sinfo_db?schema=public
      - JWT_ACCESS_SECRET=change_me_access
      - JWT_REFRESH_SECRET=change_me_refresh
      - REDIS_URL=redis://redis:6379
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    depends_on:
      - db
      - redis

  db:
    image: postgres:17-alpine
    container_name: sinfo_db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: sinfo
      POSTGRES_PASSWORD: sinfo_password
      POSTGRES_DB: sinfo_db
    volumes:
      - sinfo_db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d

  redis:
    image: redis:7-alpine
    container_name: sinfo_redis
    ports:
      - "6379:6379"

  adminer:
    image: adminer:latest
    container_name: sinfo_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      - db

volumes:
  sinfo_db_data: