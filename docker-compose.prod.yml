# Продакшн-стек. Запуск: docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
name: sluhavkainfo

services:
  # Вхідна точка проекту (HTTP). Назовні 80/443 і HTTPS тримає окремий проект /opt/gateway;
  # він підключається до цієї служби через мережу "gateway" за іменем sluhavkainfo-web.
  sluhavkainfo-web:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      # лише локально (тест/SSH-тунель): http://127.0.0.1:8081
      - "127.0.0.1:${LOCAL_PORT:-8081}:80"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      default:
      gateway:
        aliases:
          - sluhavkainfo-web
    depends_on:
      - backend
      - frontend

  frontend:
    build:
      context: ./sinfo
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      target: runtime
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://sinfo:${POSTGRES_PASSWORD:?set in .env.production}@db:5432/sinfo_db?schema=public
      GOOGLE_CREDENTIALS_PATH: /run/secrets/google-service-account.json
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set in .env.production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set in .env.production}
      LINK_SIGNING_SECRET: ${LINK_SIGNING_SECRET:?set in .env.production}
      CORS_ORIGINS: ${CORS_ORIGINS:?set in .env.production}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://seaweedfs:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set in .env.production}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set in .env.production}
      S3_BUCKET: sinfo
    volumes:
      - ./secrets:/run/secrets:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # одноразові задачі (seed): docker compose -f docker-compose.prod.yml --profile tools run --rm tools npx prisma db seed
  tools:
    profiles: ["tools"]
    build:
      context: ./backend
      target: build
    environment:
      DATABASE_URL: postgresql://sinfo:${POSTGRES_PASSWORD:?set in .env.production}@db:5432/sinfo_db?schema=public
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sinfo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env.production}
      POSTGRES_DB: sinfo_db
    volumes:
      - sinfo_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sinfo -d sinfo_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - sinfo_redis_data:/data

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    command: server -dir=/data -s3
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?set in .env.production}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?set in .env.production}
    volumes:
      - sinfo_storage_data:/data

networks:
  # спільна мережа з gateway; створюється один раз: docker network create gateway
  gateway:
    external: true

volumes:
  sinfo_db_data:
  sinfo_redis_data:
  sinfo_storage_data:
