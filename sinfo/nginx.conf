# схема з X-Forwarded-Proto від Caddy (усередині мережі це http)
map $http_x_forwarded_proto $public_scheme {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    # OG-теги потребують абсолютних посилань: підставляємо адресу сайту
    sub_filter '__ORIGIN__' '$public_scheme://$http_host';
    sub_filter_once off;
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
